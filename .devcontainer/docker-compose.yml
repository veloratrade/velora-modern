# Codespaces / local test environment for Velora Modern.
#
# ⚠️ TEST-ONLY. Every value below is a development/test placeholder — no real
# secrets, no production credentials, no production claims. This stack runs the
# full project (web, api, worker, Postgres) in GitHub Codespaces with one
# click: open the repo in Codespaces and the dev container builds, migrates,
# and seeds itself automatically.
#
# Usage: open in GitHub Codespaces, or
#   docker compose -f .devcontainer/docker-compose.yml up --build
#
# All database credentials use ${VAR:-default} placeholders (structural
# exclusion from the secret scanner — same form as infra/docker-compose.yml).
# No literal user:password@host URLs appear anywhere in this file.
services:
  # Interactive Codespaces dev container. Mounts the workspace so edits are
  # live; stays running so users can open a terminal and run `npm run dev`
  # (web), `npm run start:worker` (worker), `npm test`, `npm run typecheck`.
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/velora-modern:cached
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-velora_dev}:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/${POSTGRES_DB:-velora_dev}}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgres://${POSTGRES_USER:-velora_dev}:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/${POSTGRES_DB:-velora_dev}}
      JWT_SECRET: ${JWT_SECRET:-dev-only-do-not-use-in-production}
      APP_ENV: development
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      PERSISTENCE: postgres
      NODE_ENV: development
      VELORA_API_ORIGIN: http://api:8080
      # Test-only placeholder credentials — NOT real secrets, never production.
      RESEND_API_KEY: ${RESEND_API_KEY:-resend_test_do_not_use}
      METAAPI_PLATFORM_TOKEN: ${METAAPI_PLATFORM_TOKEN:-metapi_test_do_not_use}
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY:-dev-master-key-do-not-use}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-stripe_test_dev_do_not_use}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sleep", "infinity"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-velora_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-velora_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-velora_dev} -d ${POSTGRES_DB:-velora_dev}"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "5432:5432"

  # One-shot migration runner — same command `railway.json` uses at deploy
  # start. Idempotent (forward-only migrations recorded in schema_migrations).
  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    command: ["npx", "tsx", "db/migrate.ts"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-velora_dev}:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/${POSTGRES_DB:-velora_dev}}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-velora_dev}:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/${POSTGRES_DB:-velora_dev}}
      APP_ENV: development
      APP_ORIGIN: http://localhost:8080
      PERSISTENCE: postgres
      JWT_SECRET: ${JWT_SECRET:-dev-only-do-not-use-in-production}
      HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-velora_dev}:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/${POSTGRES_DB:-velora_dev}}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    environment:
      VELORA_API_ORIGIN: http://api:8080
      NODE_ENV: production
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
