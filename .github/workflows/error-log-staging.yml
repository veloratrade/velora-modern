# Error Log Diagnostics (staging) — sanitized Railway log tail.
#
# Port of PHP `error-log-staging.yml` (host error-log tail -> `railway logs`).
# Read-only, manual, `READ`-confirmed. The application contract forbids logging
# secrets (see docs/governance/OPERATIONAL_CONTRACT.md); as defense in depth
# this workflow redacts bearer/token-like fragments before printing.
# Production log access stays a manual owner procedure (see
# docs/ops/DIAGNOSTICS_RUNBOOK.md) — no production log workflow exists by design.
name: Error Log Diagnostics (staging)

on:
  workflow_dispatch:
    inputs:
      confirm_read:
        description: 'To read the staging log tail, type exactly: READ'
        required: true
        default: ''
        type: string
      tail_lines:
        description: 'Log lines to fetch (10-500)'
        required: false
        default: '200'
        type: string

permissions:
  contents: read

jobs:
  read_logs:
    name: Read sanitized staging log tail
    if: github.repository == 'veloratrade/velora-modern'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      RAILWAY_PROJECT_ID: 56d1762e-79d3-4518-b788-5eda1d93dd22
      RAILWAY_SERVICE: velora-modern
    steps:
      - name: Verify confirm + bounds
        run: |
          if [ "${{ inputs.confirm_read }}" != "READ" ]; then
            echo "::error::wrong confirm phrase — nothing was read."
            exit 1
          fi
          if ! echo "${{ inputs.tail_lines }}" | grep -Eq '^[0-9]{2,3}$'; then
            echo "::error::tail_lines must be a number between 10 and 500."
            exit 1
          fi
          if [ "${{ inputs.tail_lines }}" -lt 10 ] || [ "${{ inputs.tail_lines }}" -gt 500 ]; then
            echo "::error::tail_lines must be a number between 10 and 500."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Fetch and redact log tail
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not set on the staging environment."
            exit 1
          fi
          railway link --project "$RAILWAY_PROJECT_ID" --environment staging --service "$RAILWAY_SERVICE"
          railway logs --tail "${{ inputs.tail_lines }}" 2>&1 \
            | sed -E -e 's/(Bearer )[A-Za-z0-9._~+/-]+/\1[REDACTED]/g' \
                     -e 's/([Tt]oken["'"'"'=: ]+)[A-Za-z0-9._~+/-]{8,}/\1[REDACTED]/g' \
            | tail -n "${{ inputs.tail_lines }}"
