# Velora Secret Scan — committed-secret / forbidden-file / real-user-data gate.
#
# Semantic port of the PHP `secret-scan` job (csp-guard.yml):
#   1. Forbidden files (.env, keys, sqlite, ...) must never be committed.
#   2. Real user data (password hashes, public-mail addresses) must never
#      appear in SQL/dump files.
# Modern-native extension: high-precision committed-secret patterns for the
# credential types this repository handles (see scripts/secret-scan.ts).
#
# Output discipline: findings print PATH + LINE + RULE only. Secret values are
# never printed. Safe to run on pull requests from any branch.
name: Secret Scan

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    name: Secret scan (tracked tree)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run secret scan (fail-closed on findings)
        run: npx tsx scripts/secret-scan.ts
