# CI — Phase 1 foundation (ADR-010 + PHP-era cost-guard discipline).
#
# GOVERNANCE: GitHub Actions is ENABLED with cost controls per owner policy.
# Triggers are limited to push[main] + pull_request[main] only; no schedules,
# no caches, standard runner only, 15-minute timeout, cancel-in-progress.
# This mirrors tools/check_github_cost_guard.py philosophy from the PHP repository.
# Previously the repository was intentionally disabled; it was re-enabled for
# verified readiness (main at 354edaa) with the same controls preserved.
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Tesseract OCR (for unconditional real-binary test — deployment image still lacks it; CI-only, see infra/Dockerfile.api)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b packages/contracts packages/domain apps/api apps/worker apps/web
      - name: Unit + contract tests
        run: node tools/run-tests.mjs
      - name: Migration tests (disposable PGlite — NOT production evidence)
        run: npm run test:migrations
      - name: Secret-safety scan (public repository policy)
        run: bash tools/secret-scan.sh
      - name: Dependency audit (high+ only, informational)
        run: npm audit --audit-level=high || true
