# CI — Phase 1 foundation (ADR-010 + PHP-era cost-guard discipline).
#
# ⚠️ GOVERNANCE: GitHub Actions is DISABLED at the repository level per the
# owner's cost policy. This workflow executes only after (a) the owner pushes
# these commits (explicit authorization required) and (b) Actions is enabled
# for an authorized window. No schedules, no caches, standard runner only,
# 15-minute timeout, cancel-in-progress — mirroring tools/check_github_cost_guard.py
# philosophy from the PHP repository.
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b packages/contracts packages/domain apps/api apps/worker apps/web
      - name: Unit + contract tests
        run: node tools/run-tests.mjs
      - name: Migration tests (disposable PGlite — NOT production evidence)
        run: npm run test:migrations
      - name: Secret-safety scan (public repository policy)
        run: bash tools/secret-scan.sh
