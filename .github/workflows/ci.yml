name: Velora Modern CI Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Typecheck, Guards, Test, i18n Gate & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Localization Quality Gate
        run: npm run i18n:check

      - name: Structure Guard
        run: npm run structure:check

      - name: GitHub Cost Policy Guard
        run: npm run github:cost:check

      - name: Run Vitest Suite
        run: npm run test

      - name: Build TypeScript Project
        run: npm run build

  secret_scan:
    name: Secret scan
    uses: ./.github/workflows/secret-scan.yml
