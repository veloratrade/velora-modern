# Velora Health Check Suite (reusable) — single home of live smoke logic.
#
# Semantic port of the PHP `healthcheck-suite.yml` responsibility, adapted to
# the MODERN API contract (NOT the PHP contract):
# - Modern GET /health is frozen B-8 envelope `{status:'success', data:{status:'ok', time}, ...}`
#   per OD-3, C-01, ADR-006 and server.test.ts. This suite asserts the frozen B-8 envelope.
# - Same-origin logout probes + CSP-manifest comparisons have no Modern subject
#   (API-only service, no static HTML, no manifest): replaced by guard probes
#   (401 auth boundary + 400 validation boundary, both side-effect-free) and
#   Helmet header assertions.
# - 404-envelope assertion preserves the PHP envelope-contract check (B-8 class).
# - Version drift (reported vs package.json) is recorded as evidence and warns
#   only; it never fails the suite (drift is a governance finding, not an outage).
name: Health Check Suite (reusable)

on:
  workflow_call:
    inputs:
      base_url:
        description: 'Target origin, e.g. https://staging-modern.veloratrade.ir (never a secret)'
        required: true
        type: string
      environment_name:
        description: 'staging | production'
        required: true
        type: string
      guard_probes:
        description: 'Run side-effect-free guard probes (401 + 400 boundaries)'
        required: false
        default: false
        type: boolean
      confirm_production_probes:
        description: 'Required exact phrase for guard probes against production'
        required: false
        default: ''
        type: string
    outputs:
      reported_version:
        description: 'Version string reported by GET /health'
        value: ${{ jobs.smoke.outputs.reported_version }}

permissions:
  contents: read

jobs:
  smoke:
    name: Live smoke suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      reported_version: ${{ steps.probe.outputs.reported_version }}
    steps:
      - name: Checkout repository (package.json version reference)
        uses: actions/checkout@v4

      - name: Run smoke checks
        id: probe
        env:
          BASE: ${{ inputs.base_url }}
          ENVNAME: ${{ inputs.environment_name }}
          GUARD_PROBES: ${{ inputs.guard_probes }}
          CONFIRM_PROD: ${{ inputs.confirm_production_probes }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.request, urllib.error, urllib.parse

          BASE = os.environ.get('BASE', '').rstrip('/')
          ENVNAME = os.environ.get('ENVNAME', '')
          GUARD = os.environ.get('GUARD_PROBES', '') == 'true'
          CONFIRM = os.environ.get('CONFIRM_PROD', '')
          UA = 'velora-healthcheck'
          failures = []

          def check(name, ok, detail):
              print(('PASS ' if ok else 'FAIL ') + name + ' — ' + detail)
              if not ok:
                  failures.append(name)

          # ── Fail closed on bad invocation ──────────────────────────
          if not BASE.startswith('https://'):
              print('::error::base_url must be an https origin (got empty/non-https value)')
              sys.exit(1)
          if ENVNAME not in ('staging', 'production'):
              print(f"::error::environment_name must be staging|production (got {ENVNAME!r})")
              sys.exit(1)
          if GUARD and ENVNAME == 'production' and CONFIRM != 'GUARD-PROBES-PRODUCTION':
              print('::error::guard probes against production require the exact confirm phrase')
              sys.exit(1)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a, **k):
                  return None

          def call(method, path, payload=None, tries=3):
              safe = urllib.parse.quote(path, safe='/?&=%-._~')
              data = json.dumps(payload).encode() if payload is not None else None
              last = ('ERR no-attempt', {}, '')
              for attempt in range(tries):
                  req = urllib.request.Request(BASE + safe, data=data, method=method)
                  req.add_header('User-Agent', UA)
                  if data is not None:
                      req.add_header('Content-Type', 'application/json')
                  try:
                      r = urllib.request.build_opener(NoRedirect).open(req, timeout=30)
                      return r.status, dict(r.headers), r.read(65536).decode('utf-8', 'replace')
                  except urllib.error.HTTPError as e:
                      return e.code, dict(e.headers), e.read(65536).decode('utf-8', 'replace')
                  except Exception as e:
                      last = (f'ERR {e}', {}, '')
                      time.sleep(5)
              return last

          # ── 1. GET /health — Frozen B-8 / OD-3 envelope contract ────
          st, hd, body = call('GET', '/health')
          reported_version = 'n/a'
          ok = (st == 200)
          detail = f'status={st}'
          try:
              payload = json.loads(body)
              data = payload.get('data') or {}
              reported_version = str(payload.get('version', data.get('version', 'n/a')))
              ok = (
                  ok
                  and payload.get('status') == 'success'
                  and data.get('status') == 'ok'
                  and payload.get('error') is None
                  and 'timestamp' in payload
              )
              detail += f"; status={payload.get('status')!r} data.status={data.get('status')!r} time={data.get('time')!r}"
          except Exception:
              ok = False
              detail += f'; invalid JSON; snippet={body[:160]!r}'
          check('GET /health → 200 + B-8 envelope {status:success, data:{status:ok}}', ok, detail)

          # ── 2. Helmet security headers present ─────────────────────
          hd_low = {k.lower(): v for k, v in hd.items()}
          check('Helmet x-frame-options == DENY',
                hd_low.get('x-frame-options') == 'DENY',
                f"value={hd_low.get('x-frame-options')!r}")

          # ── 3. 404 envelope contract (B-8 class) ───────────────────
          st, _, body = call('GET', '/no-such-route-velora-probe')
          ok = (st == 404)
          detail = f'status={st}'
          try:
              payload = json.loads(body)
              err = payload.get('error') or {}
              ok = ok and payload.get('status') == 'error' and err.get('code') == 'NOT_FOUND'
              detail += f"; code={err.get('code')!r}"
          except Exception:
              ok = False
              detail += f'; invalid JSON; snippet={body[:160]!r}'
          check('GET /no-such-route → 404 + NOT_FOUND envelope', ok, detail)

          # ── 4. Guard probes (side-effect-free by construction) ─────
          if GUARD:
              st, _, _ = call('GET', '/api/v1/trades')
              check('GET /api/v1/trades w/o token → 401 (auth boundary live)',
                    st == 401, f'status={st}')
              st, _, _ = call('POST', '/api/v1/auth/forgot-password', {})
              check('POST forgot-password {} → 400 (validation boundary live, no side effects)',
                    st == 400, f'status={st}')

          # ── 5. Public landing 200 + footer marker (R-01 200/footer) ─────
          st, hd, body = call('GET', '/')
          hd_low2 = {k.lower(): v for k, v in hd.items()}
          ok_land = (st == 200)
          detail_land = f'status={st}'
          try:
              body_low = body.lower()
              has_footer = ('velora' in body_low) or ('<footer' in body_low)
              ok_land = ok_land and has_footer and len(body) > 800
              detail_land += f'; bytes={len(body)} footer={has_footer}'
              robots = hd_low2.get('x-robots-tag', '')
              if ENVNAME == 'staging' and robots:
                  print(f"info: staging landing X-Robots-Tag={robots!r} (expected noindex,nofollow per ADR-009)")
          except Exception:
              ok_land = False
              detail_land += f'; body read failed snippet={body[:120]!r}'
          check('GET / → 200 + product footer (landing shell)', ok_land, detail_land)

          # ── 6. robots.txt + sitemap.xml env parity (C-04/C-05, ADR-009) ────
          st, hd, body = call('GET', '/robots.txt')
          hd_low = {k.lower(): v for k, v in hd.items()}
          ok = (st == 200)
          detail = f'status={st}'
          try:
              if ENVNAME == 'staging':
                  ok = ok and ('disallow: /' in body.lower())
                  detail += f"; staging Disallow:/ present={('disallow: /' in body.lower())}"
              else:
                  ok = ok and ('disallow: /admin' in body.lower() or 'disallow:' in body.lower())
                  detail += f"; prod robots body {len(body)}b"
          except Exception:
              ok = False
              detail += f'; snippet={body[:120]!r}'
          check('GET /robots.txt → 200 + env-appropriate Disallow (C-05)', ok, detail)

          st2, hd2, _ = call('GET', '/sitemap.xml')
          ok2 = True
          detail2 = f'status={st2}'
          if ENVNAME == 'staging':
              ok2 = (st2 == 404)
              detail2 += '; expected 404 on staging (C-04)'
              robots2 = {k.lower(): v for k, v in hd2.items()}.get('x-robots-tag', '')
              if st2 == 200 and 'noindex' not in robots2.lower():
                  print(f"::warning::staging sitemap 200 without X-Robots-Tag noindex (got {robots2!r}) — ADR-009 says staging sitemap must be noindex")
          else:
              ok2 = (st2 in (200, 404))
              detail2 += f'; prod allows 200|404 (got {st2})'
          check('GET /sitemap.xml env parity (C-04)', ok2, detail2)

          # ── 7. App shell noindex edge contract (proxy no-store + DENY) ────
          st3, hd3, _ = call('GET', '/dashboard')
          hd3_low = {k.lower(): v for k, v in hd3.items()}
          ok3 = (st3 in (302, 303, 307, 308, 401, 403))
          detail3 = f'status={st3}'
          cc = hd3_low.get('cache-control', '')
          xfo = hd3_low.get('x-frame-options', '')
          ok3 = ok3 and ('no-store' in cc.lower() or 'private' in cc.lower() or cc == '')
          if 'x-frame-options' in hd3_low:
              ok3 = ok3 and (xfo == 'DENY')
              detail3 += f'; cache={cc!r} xfo={xfo!r}'
          else:
              detail3 += f'; cache={cc!r} (xfo absent — warn)'
              print(f"::warning::/dashboard probe missing X-Frame-Options (got headers {list(hd3.keys())[:6]})")
          check('GET /dashboard (unauth) → auth deny + no-store/DENY (app shell noindex edge contract)', ok3, detail3)

          # ── 8. Version-drift evidence (warn only, never fails) ─────
          try:
              with open('package.json', encoding='utf-8') as f:
                  repo_version = json.load(f).get('version', 'unknown')
          except Exception:
              repo_version = 'unknown'
          if reported_version != repo_version:
              print(f"::warning::version drift: live reports {reported_version!r}, repo package.json is {repo_version!r} (governance finding, not an outage)")
          else:
              print(f'version match: live == repo == {reported_version!r}')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'reported_version={reported_version}\n')

          if failures:
              print(f"::error::smoke suite failed: {', '.join(failures)}")
              sys.exit(1)
          print('SMOKE SUITE PASS')
          PY
